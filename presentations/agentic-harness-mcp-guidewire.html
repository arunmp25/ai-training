<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Harness, MCP and Guidewire</title>
<style>
:root{
  --y:#FFE600; --dk:#2E2E38; --dk2:#1A1A24; --g:#747480; --lg:#C4C4CD; --bg2:#F6F6FA; --w:#FFFFFF;
  --blue:#188CE5; --green:#2DB757; --orange:#FF6D00;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#111116;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0;}
.slide{position:absolute;inset:0;background:var(--w);color:var(--dk);opacity:0;visibility:hidden;transition:opacity .45s ease, visibility 0s linear .45s;overflow:hidden}
.slide.active{opacity:1;visibility:visible;transition:opacity .45s ease}
.slide.dark{background:var(--dk);color:var(--w)}
.el{position:absolute;display:flex;flex-direction:column;opacity:0;transform:translateY(10px) scale(.98);
  transition:opacity .45s ease, transform .45s cubic-bezier(.2,.8,.2,1), background-color .3s, box-shadow .3s;}
.el.on{opacity:1;transform:none}
.el > div{width:100%}
.ttl{font-size:42.7px;font-weight:bold}
.mono{font-family:"Courier New",Courier,monospace}
.foot{position:absolute;left:58px;top:677px;font-size:13.3px;color:var(--g)}
.num{position:absolute;right:58px;top:677px;font-size:13.3px;color:var(--g)}
svg.ln{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none;overflow:visible}
svg.ln .reveal{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);transition:stroke-dashoffset .6s ease}
svg.ln.on .reveal{stroke-dashoffset:0}
svg.ln .flow{opacity:0;stroke-dasharray:3 14;animation:march 1s linear infinite;transition:opacity .4s ease .6s}
svg.ln.on .flow{opacity:1}
@keyframes march{to{stroke-dashoffset:-17}}
.cur{background:rgba(255,230,0,.6);border-radius:3px;font-weight:bold;box-shadow:0 0 0 2px rgba(255,230,0,.6)}
.packet{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--y);
  box-shadow:0 0 0 2px var(--dk),0 0 12px 3px rgba(255,230,0,.8);pointer-events:none;z-index:50}
.hot{box-shadow:0 0 0 4px var(--y),0 0 22px 6px rgba(255,230,0,.75) !important}
table.cmp{border-collapse:collapse;width:100%;font-size:18.7px}
table.cmp td,table.cmp th{border:1px solid var(--lg);padding:0 8px;height:38px;text-align:left}
table.cmp tr{opacity:0;transform:translateX(-14px);transition:opacity .4s ease, transform .4s ease}
.on table.cmp tr{opacity:1;transform:none}
.on table.cmp tr:nth-child(2){transition-delay:.12s}.on table.cmp tr:nth-child(3){transition-delay:.24s}
.on table.cmp tr:nth-child(4){transition-delay:.36s}.on table.cmp tr:nth-child(5){transition-delay:.48s}
.ping{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--y);box-shadow:0 0 0 2px var(--dk);opacity:0;transition:opacity .4s ease .5s}
.on .ping,.ping.on{opacity:1}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:38vh;overflow:auto;background:rgba(26,26,36,.96);color:#fff;
  font-size:17px;line-height:1.5;padding:16px 24px 20px;transform:translateY(100%);transition:transform .3s ease;z-index:100;border-top:3px solid var(--y)}
#notes.open{transform:none}
#notes b{color:var(--y)}
#hud{position:fixed;right:14px;bottom:12px;display:flex;gap:6px;z-index:90;opacity:.25;transition:opacity .2s}
#hud:hover{opacity:1}
#hud button{background:#2E2E38;color:#fff;border:1px solid #555;border-radius:6px;padding:6px 10px;font:13px Arial;cursor:pointer}
#help{position:fixed;left:14px;bottom:12px;color:#888;font:12px Arial;z-index:90}
.stepdots{position:absolute;left:50%;transform:translateX(-50%);top:683px;display:flex;gap:4px}
#help{transition:opacity 1s}#help.gone{opacity:0}
.el.late{transition-delay:.6s !important}
.stepdots i{width:6px;height:6px;border-radius:50%;background:var(--lg)}
.stepdots i.done{background:var(--dk)}
.dark .stepdots i.done{background:var(--y)}
@media (prefers-reduced-motion: reduce){ .el,svg.ln .reveal,table.cmp tr{transition:none} svg.ln .flow{animation:none} }
</style>
</head>
<body>
<div id="stage"></div>
<svg width="0" height="0" style="position:absolute">
  <defs id="markers"></defs>
</svg>
<div id="notes"></div>
<div id="hud"><button id="bPrev" title="Back (←)">◀</button><button id="bPlay" title="Auto-play (P)">▶ Play</button><button id="bNotes" title="Speaker notes (N)">Notes</button><button id="bFull" title="Full screen (F)">⛶</button><button id="bNext" title="Next (→ or Space)">▶</button></div>
<div id="help">→ / Space: next · ←: back · N: notes · P: play · F: full screen</div>

<script>
/* ===================== engine ===================== */
const I = v => v * 96;                 // inches → px (deck is 13.333 × 7.5 in)
const PT = v => v * 4 / 3;             // points → px
const COL = { dk:"#2E2E38", w:"#FFFFFF", y:"#FFE600", g:"#747480", lg:"#C4C4CD", bg2:"#F6F6FA", blue:"#188CE5", green:"#2DB757", orange:"#FF6D00", dk2:"#1A1A24" };
const css = c => COL[c] || c;
const stage = document.getElementById("stage");
const SLIDES = [];
let uid = 0;

// arrow markers, one per colour
document.getElementById("markers").innerHTML = Object.entries(COL).map(([k, v]) =>
  `<marker id="m-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${v}"/></marker>`).join("");

function makeSlide({ title, sub, dark, notes, section }) {
  const el = document.createElement("section");
  el.className = "slide" + (dark ? " dark" : "");
  stage.appendChild(el);
  const S = { el, steps: 0, notes, hooks: [], items: [], dark };
  SLIDES.push(S);
  const add = (node, step) => {
    node.dataset.step = step || 0;
    S.steps = Math.max(S.steps, step || 0);
    el.appendChild(node); S.items.push(node); return node;
  };
  S.add = add;
  S.box = o => {
    const d = document.createElement("div");
    d.className = "el box" + (o.cls ? " " + o.cls : "");
    Object.assign(d.style, {
      left: I(o.x) + "px", top: I(o.y) + "px", width: I(o.w) + "px", height: I(o.h) + "px",
      background: o.fill === "none" ? "transparent" : css(o.fill || "bg2"), color: css(o.color || "dk"),
      border: o.line ? `${o.lineW || 1.3}px ${o.dash ? "dashed" : "solid"} ${css(o.line)}` : "none",
      borderRadius: (o.r === undefined ? 6 : o.r) + "px", fontSize: PT(o.size || 14) + "px", fontWeight: o.bold ? "bold" : "normal",
      textAlign: o.align || "center", justifyContent: { top: "flex-start", bottom: "flex-end" }[o.valign] || "center",
      padding: (o.pad === undefined ? 8 : o.pad) + "px " + (o.padX === undefined ? (o.pad === undefined ? 10 : o.pad) : o.padX) + "px", lineHeight: 1.22,
    });
    if (o.round) d.style.borderRadius = "50%";
    const h = String(o.html);
    d.innerHTML = `<div>${/<(table|ul)/.test(h) ? h.replace(/\n\s*/g, "") : h.replace(/\n/g, "<br>")}</div>`;
    if (o.id) d.id = o.id;
    return add(d, o.step);
  };
  S.label = (html, x, y, w, h, o = {}) => S.box(Object.assign({ x, y, w, h, html, fill: "none", pad: 0, r: 0, align: "left", size: 12 }, o));
  S.arrow = (x1, y1, x2, y2, o = {}) => {
    const id = "mk" + (++uid);
    const X1 = I(x1), Y1 = I(y1), X2 = I(x2), Y2 = I(y2);
    const L = Math.hypot(X2 - X1, Y2 - Y1) + 20;
    const c = o.color || "dk", wd = o.width || 1.8;
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("class", "ln"); s.setAttribute("viewBox", "0 0 1280 720");
    s.innerHTML = `<defs><mask id="${id}" maskUnits="userSpaceOnUse" x="-50" y="-50" width="1380" height="820">
        <line class="reveal" style="--L:${L}" x1="${X1}" y1="${Y1}" x2="${X2}" y2="${Y2}" stroke="#fff" stroke-width="16" stroke-linecap="square"/></mask></defs>
      <line mask="url(#${id})" x1="${X1}" y1="${Y1}" x2="${X2}" y2="${Y2}" stroke="${css(c)}" stroke-width="${wd}"
        ${o.dash ? `stroke-dasharray="6 4"` : ""} ${o.noHead ? "" : `marker-end="url(#m-${c})"`}/>
      ${o.flow ? `<line class="flow" x1="${X1}" y1="${Y1}" x2="${X2}" y2="${Y2}" stroke="${css(o.flow === true ? "y" : o.flow)}" stroke-width="4" stroke-linecap="round"/>` : ""}`;
    if (o.delay) s.querySelector(".reveal").style.transitionDelay = o.delay + "ms";
    s.dataset.step = o.step || 0; S.steps = Math.max(S.steps, o.step || 0);
    el.appendChild(s); S.items.push(s); return s;
  };
  S.panel = (x, y, w, h, o = {}) => S.box(Object.assign({ x, y, w, h, html: "", fill: "bg2" }, o));
  S.dot = (n, x, y, o = {}) => S.box(Object.assign({ x, y, w: 0.42, h: 0.42, html: String(n), fill: "y", bold: true, size: 13, round: true, pad: 0 }, o));
  S.onStep = fn => S.hooks.push(fn);

  if (!dark && title) {
    const t = S.label(title, 0.6, 0.35, 12.1, 0.75, { size: 32, bold: true });
    if (sub) S.label(sub, 0.6, 1.08, 12.1, 0.45, { size: 16, color: "g", valign: "top" });
    const f = document.createElement("div"); f.className = "foot"; f.textContent = "Agentic harnesses, MCP and the Guidewire Developer Assistant"; el.appendChild(f);
    const n = document.createElement("div"); n.className = "num"; n.textContent = SLIDES.length; el.appendChild(n);
  }
  if (dark) {
    S.box({ x: 0.6, y: 2.05, w: 0.55, h: 0.55, html: "", fill: "y", r: 0 });
    const t = S.label(title, 0.6, 2.85, 11.5, 2.1, { size: 44, bold: true, color: "w", valign: "top" });
    t.style.lineHeight = "1.1";
    if (sub) S.label(sub, 0.6, 5.1, 11.0, 1.0, { size: 20, color: "lg", valign: "top" });
  }
  return S;
}

// moving packet between two points (inches)
function packet(S, pts, dur = 650) {
  const p = document.createElement("div"); p.className = "packet"; S.el.appendChild(p);
  const frames = pts.map(([x, y]) => ({ transform: `translate(${I(x)}px,${I(y)}px)` }));
  const a = p.animate(frames, { duration: dur * (pts.length - 1), easing: "ease-in-out" });
  a.onfinish = () => p.remove();
  return a;
}

// Sequence diagram: colour = protocol, dashed = response, one click per message
function sequence(S, lanes, msgs, o) {
  const KIND = { mcp: "dk", api: "blue", local: "g" };
  lanes.forEach(ln => S.box({ x: ln.x - ln.w / 2, y: o.top, w: ln.w, h: 0.5, html: ln.name, fill: ln.fill, color: ln.color || "dk", bold: true, size: 12 }));
  (o.frames || []).forEach(f => {
    const y1 = o.y(f.from) - 0.27, y2 = o.y(f.to) + 0.08;
    S.box({ x: f.x1, y: y1, w: f.x2 - f.x1, h: y2 - y1, html: "", fill: "rgba(255,109,0,.06)", line: "orange", lineW: 2, r: 4, step: f.a });
    S.label(f.text, f.x2 - 3.6, y1 + 0.03, 3.5, 0.22, { size: 10, bold: true, color: "orange", align: "right", step: f.a });
  });
  lanes.forEach(ln => S.arrow(ln.x, o.top + 0.5, ln.x, o.bottom, { color: "lg", width: 1.2, dash: true, noHead: true }));
  (o.tags || []).forEach(t => S.box({ x: 0.6, y: o.y(t.at) - 0.27, w: o.tagW || 1.05, h: 0.3, html: t.text, fill: t.fill || "bg2", size: 10, bold: true, pad: 0, step: t.a }));
  const X = Object.fromEntries(lanes.map(l => [l.id, l.x]));
  const first = o.firstClick || 1;
  const labels = msgs.map((m, i) => {
    const y = o.y(i), step = first + i, x1 = X[m.from], x2 = X[m.to];
    m._y = y; m._x1 = x1; m._x2 = x2;
    if (m.from === m.to) return S.box({ x: x1 - 1.0, y: y - 0.21, w: 2.0, h: 0.23, html: `${i + 1}. ${m.text}`, fill: "y", size: 10, bold: true, pad: 0, step });
    const col = KIND[m.kind || "mcp"];
    S.arrow(x1, y, x2, y, { color: col, dash: m.ret, width: 1.6, step });
    const lx = Math.min(x1, x2) + 0.08, lw = Math.abs(x2 - x1) - 0.16;
    return S.label(`<span>${i + 1}. ${m.text}</span>`, lx, y - (o.labelH + 0.02), lw, o.labelH, { size: o.size, align: x2 > x1 ? "left" : "right", color: col, step });
  });
  let detail = null;
  if (o.detail) detail = S.box(Object.assign({ html: "", fill: "dk", color: "w", align: "left", size: 11.5, pad: 8, padX: 14, cls: "mono" }, o.detail));
  S.onStep((k, forward) => {
    labels.forEach(l => { const sp = l.querySelector("span") || l.firstChild; sp.classList.remove("cur"); });
    const i = k - first;
    if (i >= 0 && i < msgs.length) {
      const l = labels[i]; (l.querySelector("span") || l.firstChild).classList.add("cur");
      const m = msgs[i];
      if (forward && m.from !== m.to) packet(S, [[m._x1, m._y], [m._x2, m._y]], 600);
      if (detail) detail.firstChild.innerHTML = `<span style="color:var(--y);font-family:Arial;font-weight:bold">${i + 1} · ${m.tag || ""}</span>&nbsp;&nbsp;${m.json || ""}`;
    } else if (detail) {
      detail.firstChild.innerHTML = `<span style="color:var(--y);font-family:Arial;font-weight:bold">Press → to step through. Each step shows the real message here.</span>`;
    }
  });
}

/* ===================== slides ===================== */
let S;

// 1 Title
S = makeSlide({ dark: true, title: "From chat to agentic harness to MCP, and how the Guidewire Developer Assistant plugs in",
  sub: "How agents run the loop, call tools and RAG, connect to MCP servers, and use Guidewire cookbooks and knowledge",
  notes: "Today we follow one idea from start to finish. First, how an agent harness differs from a chat assistant. Then the agentic loop, with tool calls and RAG lookups. Then what MCP is, how a harness connects to MCP servers, and the message sequence. Finally, how Guidewire uses MCP to deliver its Developer Assistants: cookbooks and a knowledge base built on embeddings. Press → to build each slide; N shows these notes." });

// 2 Chat vs harness
S = makeSlide({ title: "Chat-based agents vs agentic harness", sub: "The model can be the same. The difference is who runs the loop: you, or the harness.",
  notes: "<b>Click 1:</b> the chat model. You ask, it answers with text or code, and you copy, paste, run and check it yourself. Watch the dot: you are the loop, and you are the safety gate. <b>Click 2:</b> the agentic harness. You give a goal. The harness calls the model, runs the tools it asks for (files, APIs, RAG search, MCP servers), feeds the results back and repeats until the task is done, applying permissions on every action. <b>Click 3:</b> the differences in one table. Same model, different car: the harness adds the steering, the brakes and the tools." });
S.panel(0.6, 1.75, 5.9, 2.95, { step: 1 });
S.label("Chat-based agent: you are the loop", 0.85, 1.85, 5.4, 0.4, { size: 15, bold: true, step: 1 });
S.box({ x: 0.85, y: 2.4, w: 1.9, h: 0.7, html: "You ask a question", fill: "w", line: "lg", size: 12, step: 1 });
S.box({ x: 4.35, y: 2.4, w: 1.9, h: 0.7, html: "<b>Chat model</b>", fill: "lg", size: 13, step: 1 });
S.box({ x: 4.35, y: 3.5, w: 1.9, h: 0.7, html: "Text answer or code", fill: "w", line: "lg", size: 12, step: 1 });
S.box({ x: 0.85, y: 3.5, w: 1.9, h: 0.7, html: "You copy, paste, run and check", fill: "w", line: "lg", size: 12, step: 1 });
S.arrow(2.75, 2.75, 4.35, 2.75, { step: 1 });
S.arrow(5.3, 3.1, 5.3, 3.5, { step: 1, delay: 150 });
S.arrow(4.35, 3.85, 2.75, 3.85, { step: 1, delay: 300 });
S.arrow(1.8, 3.5, 1.8, 3.1, { step: 1, color: "orange", delay: 450 });
S.label("next message, by hand", 1.9, 3.15, 2.3, 0.3, { size: 11, color: "orange", step: 1, cls: "it" });
S.label("e.g. Claude.ai or ChatGPT in a browser tab", 0.85, 4.3, 5.4, 0.3, { size: 11, color: "g", step: 1 });
const chatDot = S.box({ x: 0, y: 0, w: 0.13, h: 0.13, html: "", fill: "orange", round: true, pad: 0, step: 1 });
chatDot.animate([
  { left: I(1.8) + "px", top: I(2.68) + "px" }, { left: I(5.25) + "px", top: I(2.68) + "px" },
  { left: I(5.25) + "px", top: I(3.8) + "px" }, { left: I(1.8) + "px", top: I(3.8) + "px" }, { left: I(1.8) + "px", top: I(2.68) + "px" }],
  { duration: 6000, iterations: Infinity });
S.panel(6.8, 1.75, 5.9, 2.95, { step: 2, fill: "w", line: "dk", lineW: 1.6 });
S.label("Agentic harness: the harness runs the loop", 7.05, 1.85, 5.4, 0.4, { size: 15, bold: true, step: 2 });
S.box({ x: 7.05, y: 2.4, w: 1.55, h: 0.7, html: "You give a goal", fill: "bg2", size: 12, step: 2 });
S.box({ x: 7.05, y: 3.5, w: 1.55, h: 0.7, html: "<b>Result for your review</b>", fill: "green", color: "w", size: 12, step: 2 });
S.panel(8.95, 2.35, 3.5, 1.9, { step: 2, fill: "y" });
S.label("<b>Harness</b>", 9.1, 2.42, 1.5, 0.3, { size: 12, step: 2 });
S.box({ x: 9.15, y: 2.8, w: 1.3, h: 0.6, html: "<b>Model</b>", fill: "dk", color: "w", size: 12, step: 2 });
S.box({ x: 10.95, y: 2.8, w: 1.3, h: 0.6, html: "<b>Tools · RAG · MCP</b>", fill: "w", size: 11, pad: 3, step: 2 });
S.arrow(10.45, 2.95, 10.95, 2.95, { step: 2, width: 1.5 });
S.arrow(10.95, 3.25, 10.45, 3.25, { step: 2, width: 1.5, dash: true });
const ping = S.box({ x: 0, y: 0, w: 0.13, h: 0.13, html: "", fill: "dk", round: true, pad: 0, step: 2 });
ping.animate([{ left: I(10.3) + "px", top: I(2.89) + "px" }, { left: I(10.95) + "px", top: I(2.89) + "px" }, { left: I(10.95) + "px", top: I(3.19) + "px" }, { left: I(10.3) + "px", top: I(3.19) + "px" }, { left: I(10.3) + "px", top: I(2.89) + "px" }],
  { duration: 1600, iterations: Infinity });
S.label("<i>repeats until the task is done</i>", 9.15, 3.55, 3.1, 0.3, { size: 11, step: 2 });
S.label("<i>permissions on every action</i>", 9.15, 3.85, 3.1, 0.3, { size: 11, step: 2 });
S.arrow(8.6, 2.75, 8.95, 2.75, { step: 2 });
S.arrow(8.95, 3.85, 8.6, 3.85, { step: 2, delay: 300 });
S.label("e.g. Claude Code, Agent SDK, Copilot agent mode", 7.05, 4.3, 5.4, 0.3, { size: 11, color: "g", step: 2 });
S.label(`<table class="cmp"><tr><th style="width:150px"></th><th style="background:var(--lg)">Chat-based agent</th><th style="background:var(--y)">Agentic harness</th></tr>
  <tr><td><b>Actions</b></td><td>Suggests; you copy, paste and run</td><td>Runs tools itself: files, APIs, shell, RAG, MCP</td></tr>
  <tr><td><b>Context</b></td><td>Only what you paste in</td><td>Fetches what it needs and manages its own context</td></tr>
  <tr><td><b>Memory</b></td><td>The conversation</td><td>Project instructions and memory files (e.g. CLAUDE.md)</td></tr>
  <tr><td><b>Guard rails</b></td><td>You check every reply</td><td>Permissions, approvals, hooks, sandbox</td></tr></table>`, 0.6, 4.85, 12.1, 2.05, { step: 3, valign: "top" });

// 3 Agentic loop
S = makeSlide({ title: "Plan → Act → Observe → Done? → repeat", sub: "One task takes many runs of the loop. Each run is one model call; the tool or RAG result changes the next step.",
  notes: "This is the loop from Topic 14 of the course. <b>Click 1:</b> the cycle. The model plans the next step, the harness acts on it by running a tool, a RAG lookup or an MCP call, the result goes back into the context, and the model checks whether it is done. <b>Clicks 2 to 7:</b> one task, six runs. Watch the dot go round once per run. Run 1 searches the code. Run 2 is a RAG lookup: the underwriting guidelines say <i>under</i> 25. Run 3 reads the code and finds the off-by-one. Run 4 proves it with a failing test. Run 5 needs approval to edit a file: the harness enforces that. Run 6 runs the full suite and, with nothing left to do, the model replies with end_turn. The agent did not know the plan in advance. Each observation changed the next step." });
const nodeHTML = (t, sub) => `<b style="font-size:20px">${t}</b><br><span class="sub" style="font-size:13.3px">${sub}</span>`;
const nPlan = S.box({ x: 2.5, y: 1.8, w: 1.8, h: 0.8, html: nodeHTML("Plan", "model decides next step"), fill: "y", step: 1 });
const nAct = S.box({ x: 4.5, y: 3.35, w: 1.8, h: 0.8, html: nodeHTML("Act", "tool call · RAG · MCP"), fill: "dk", color: "w", step: 1 });
const nObs = S.box({ x: 2.5, y: 4.9, w: 1.8, h: 0.8, html: nodeHTML("Observe", "result added to context"), fill: "bg2", step: 1 });
const nDone = S.box({ x: 0.5, y: 3.35, w: 1.8, h: 0.8, html: nodeHTML("Done?", "any tool_use left?"), fill: "green", color: "w", step: 1 });
S.arrow(4.3, 2.4, 5.2, 3.35, { step: 1, width: 2.4 });
S.arrow(5.2, 4.15, 4.3, 5.0, { step: 1, width: 2.4, delay: 150 });
S.arrow(2.5, 5.3, 1.4, 4.15, { step: 1, width: 2.4, delay: 300 });

/* ===================== navigation ===================== */
let cur = 0, step = 0, timer = null;
SLIDES.forEach(s => {
  // stagger items that share a step
  const byStep = {};
  s.items.forEach(n => { const k = n.dataset.step; byStep[k] = (byStep[k] || 0) + 1; const d = Math.min(byStep[k] - 1, 12) * 35; if (n.classList.contains("el")) n.style.transitionDelay = d + "ms"; });
  if (s.steps) { const d = document.createElement("div"); d.className = "stepdots"; d.innerHTML = "<i></i>".repeat(s.steps); s.el.appendChild(d); s.dots = d; }
});
function render(fwd) {
  const s = SLIDES[cur];
  SLIDES.forEach((x, i) => x.el.classList.toggle("active", i === cur));
  s.items.forEach(n => n.classList.toggle("on", +n.dataset.step <= step));
  if (s.dots) [...s.dots.children].forEach((d, i) => d.classList.toggle("done", i < step));
  s.hooks.forEach(h => h(step, fwd));
  document.getElementById("notes").innerHTML = `<b>Slide ${cur + 1} of ${SLIDES.length}${s.steps ? ` · step ${step} of ${s.steps}` : ""}</b><br>${s.notes || ""}`;
  history.replaceState(null, "", "#" + (cur + 1));
}
function enter(i, atEnd) {
  const s = SLIDES[cur]; s.items.forEach(n => n.classList.remove("on"));
  cur = i; step = atEnd ? SLIDES[i].steps : 0;
  SLIDES[i].items.forEach(n => n.classList.remove("on"));
  requestAnimationFrame(() => requestAnimationFrame(() => render(!atEnd)));
}
function next() { if (step < SLIDES[cur].steps) { step++; render(true); } else if (cur < SLIDES.length - 1) enter(cur + 1); else stop(); }
function prev() { if (step > 0) { step--; render(false); } else if (cur > 0) enter(cur - 1, true); }
function play() { if (timer) return stop(); timer = setInterval(next, 1800); document.getElementById("bPlay").textContent = "❚❚ Pause"; }
function stop() { clearInterval(timer); timer = null; document.getElementById("bPlay").textContent = "▶ Play"; }
function toggleNotes() { document.getElementById("notes").classList.toggle("open"); }
function full() { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); next(); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === "Home") enter(0); else if (e.key === "End") enter(SLIDES.length - 1, true);
  else if (e.key.toLowerCase() === "n") toggleNotes(); else if (e.key.toLowerCase() === "p") play(); else if (e.key.toLowerCase() === "f") full();
});
stage.addEventListener("click", e => { if (e.target.closest("a")) return; (e.clientX > innerWidth / 3 ? next : prev)(); });
document.getElementById("bNext").onclick = next; document.getElementById("bPrev").onclick = prev;
document.getElementById("bPlay").onclick = play; document.getElementById("bNotes").onclick = toggleNotes; document.getElementById("bFull").onclick = full;
function fit() { const k = Math.min(innerWidth / 1280, innerHeight / 720); stage.style.transform = `scale(${k}) translate(-50%,-50%)`; stage.style.transformOrigin = "0 0"; stage.style.left = "50%"; stage.style.top = "50%"; stage.style.transform = `translate(-50%,-50%) scale(${k})`; stage.style.transformOrigin = "center"; }
addEventListener("resize", fit); fit();
const start = Math.max(0, Math.min(SLIDES.length - 1, (parseInt(location.hash.slice(1)) || 1) - 1));
cur = start; render(true);
setTimeout(() => document.getElementById("help").classList.add("gone"), 6000);
</script>
