# What the Docker image serves to participants.
# Edit this file, commit and push: the pipeline runs `docker build .` and the image contains only what is listed here.
# Everything else shows as "Coming soon" on the course page, and its files are not in the image.

# Course folder to package: newest (the highest vN folder, so v8 is picked up automatically) or a folder name such as v7.
VERSION=newest

# Sessions to open: all, one session (1) or a list (1,2).
SESSIONS=1

# Optional: open individual topics instead of whole sessions, by topic number (ranges allowed), e.g. 1-5 or 1-7,9.
# When TOPICS has a value, SESSIONS is ignored.
TOPICS=

# The session that includes the Microsoft 365 quick wins (0 = leave them out).
M365_SESSION=2
